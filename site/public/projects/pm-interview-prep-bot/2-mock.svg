<rect x="54" y="164" width="170" height="40" rx="10" fill="#6366F1"/>
<text x="64" y="181" font-size="9.5" font-weight="400" fill="#FFFFFF">I'd start with merchants who</text>
<text x="64" y="195" font-size="9.5" font-weight="400" fill="#FFFFFF">get the most refund calls...</text>
<rect x="16" y="212" width="170" height="40" rx="10" fill="#FAFAF9" stroke="#D4D4D8"/>
<text x="26" y="229" font-size="9.5" font-weight="400" fill="#3F3F46">Why merchants first? Who</text>
<text x="26" y="243" font-size="9.5" font-weight="400" fill="#3F3F46">else feels this pain?</text>
