<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#18181B">Claim Companion</text>
<text x="20" y="70" font-size="10" fill="#71717A">WhatsApp · after the v2 prompt</text>
<rect x="16" y="86" width="173.20000000000002" height="50" rx="10" fill="#F4F4F5"/>
<text x="27" y="101" font-size="8.5" font-weight="700" fill="#71717A">Customer</text>
<text x="27" y="113" font-size="10" fill="#3F3F46">I don't have the RC with me.</text>
<text x="27" y="127" font-size="10" fill="#3F3F46">It's at home.</text>
<rect x="50.79999999999998" y="142" width="173.20000000000002" height="92" rx="10" fill="#4F46E5"/>
<text x="61.79999999999998" y="157" font-size="8.5" font-weight="700" fill="#E0E7FF">Assistant</text>
<text x="61.79999999999998" y="169" font-size="10" fill="#FFFFFF">No problem. I can pull your</text>
<text x="61.79999999999998" y="183" font-size="10" fill="#FFFFFF">car details from the reg</text>
<text x="61.79999999999998" y="197" font-size="10" fill="#FFFFFF">number, or you can share the</text>
<text x="61.79999999999998" y="211" font-size="10" fill="#FFFFFF">RC from DigiLocker. Which is</text>
<text x="61.79999999999998" y="225" font-size="10" fill="#FFFFFF">easier?</text>
<rect x="16" y="240" width="119.2" height="36" rx="10" fill="#F4F4F5"/>
<text x="27" y="255" font-size="8.5" font-weight="700" fill="#71717A">Customer</text>
<text x="27" y="267" font-size="10" fill="#3F3F46">Reg number is fine</text>
<rect x="50.79999999999998" y="282" width="173.20000000000002" height="50" rx="10" fill="#4F46E5"/>
<text x="61.79999999999998" y="297" font-size="8.5" font-weight="700" fill="#E0E7FF">Assistant</text>
<text x="61.79999999999998" y="309" font-size="10" fill="#FFFFFF">Got it: TS09 EA 4471, Swift,</text>
<text x="61.79999999999998" y="323" font-size="10" fill="#FFFFFF">2021. Is that right?</text>
<rect x="16" y="338" width="208" height="59" rx="10" fill="#FEF2F2" stroke="#B9381B" stroke-width="1.5"/>
<text x="28" y="358" font-size="10" fill="#3F3F46">v1 said: “cannot be processed</text>
<text x="28" y="373" font-size="10" fill="#3F3F46">without the RC”. That is a denial in</text>
<text x="28" y="388" font-size="10" fill="#3F3F46">all but name.</text>
<text x="120" y="466" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Wireframe · sample data</text>
