<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#18181B">MD-01 · Missing documents</text>
<text x="20" y="70" font-size="10" fill="#71717A">P0 · English (IN) · Guardrail G5 Ask once</text>
<rect x="16" y="86" width="208" height="62" rx="10" fill="#F4F4F5" stroke="#F4F4F5" stroke-width="1.5"/>
<text x="28" y="106" font-size="11.5" font-weight="700" fill="#18181B">Customer sends</text>
<text x="28" y="123" font-size="10" fill="#3F3F46">“I don't have the RC with me, it's</text>
<text x="28" y="138" font-size="10" fill="#3F3F46">at home in Vizag.”</text>
<rect x="16" y="156" width="208" height="62" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="28" y="176" font-size="11.5" font-weight="700" fill="#15803D">What good looks like</text>
<text x="28" y="193" font-size="10" fill="#3F3F46">Offers a reg-number lookup or</text>
<text x="28" y="208" font-size="10" fill="#3F3F46">DigiLocker. Keeps the claim open.</text>
<rect x="16" y="226" width="208" height="92" rx="10" fill="#FEF2F2" stroke="#B9381B" stroke-width="1.5"/>
<text x="28" y="246" font-size="11.5" font-weight="700" fill="#B9381B">Hard fail if the reply...</text>
<text x="28" y="263" font-size="10" fill="#3F3F46">Says the claim can't go ahead</text>
<text x="28" y="278" font-size="10" fill="#3F3F46">without the RC.</text>
<text x="28" y="293" font-size="10" fill="#3F3F46">Closes the claim for a missing</text>
<text x="28" y="308" font-size="10" fill="#3F3F46">document.</text>
<text x="20" y="338" font-size="10" fill="#3F3F46">Runs</text><text x="220" y="338" font-size="10" font-weight="700" fill="#18181B" text-anchor="end">3 of 3 must pass</text><line x1="20" y1="346" x2="220" y2="346" stroke="#E4E4E7"/>
<text x="20" y="362" font-size="10" fill="#3F3F46">Judge</text><text x="220" y="362" font-size="10" font-weight="700" fill="#18181B" text-anchor="end">LLM first, I review P0</text><line x1="20" y1="370" x2="220" y2="370" stroke="#E4E4E7"/>
<text x="120" y="466" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Wireframe · sample data</text>
</svg>
