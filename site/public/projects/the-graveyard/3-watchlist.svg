<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#18181B">Still alive</text>
<text x="20" y="70" font-size="10" font-weight="400" fill="#71717A">But on my watchlist</text>
<text x="20" y="93" font-size="10" font-weight="400" fill="#3F3F46">Live features I'd cut today.</text>
<text x="20" y="110" font-size="10" font-weight="400" fill="#3F3F46">Each has a two-page memo.</text>
<rect x="16" y="131" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#D4D4D8"/>
<text x="26" y="149" font-size="11" font-weight="700" fill="#3F3F46">Scratch cards</text>
<text x="26" y="164" font-size="9.5" fill="#3F3F46">Pay you in “Better luck next time”.</text>
<text x="26" y="177" font-size="9.5" fill="#3F3F46">I'd swap it for pick 1 of 3.</text>
<rect x="180.4" y="139" width="35.6" height="16" rx="8" fill="#4F46E5"/><text x="198.2" y="150.5" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Memo</text>
<rect x="16" y="201" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#D4D4D8"/>
<text x="26" y="219" font-size="11" font-weight="700" fill="#3F3F46">Paytm launch ads</text>
<text x="26" y="234" font-size="9.5" fill="#3F3F46">Ads sit between you and Scan.</text>
<text x="26" y="247" font-size="9.5" fill="#3F3F46">I'd make home scan-first.</text>
<rect x="180.4" y="209" width="35.6" height="16" rx="8" fill="#4F46E5"/><text x="198.2" y="220.5" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Memo</text>
<rect x="16" y="271" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#D4D4D8"/>
<text x="26" y="289" font-size="11" font-weight="700" fill="#3F3F46">Ola bot-only support</text>
<text x="26" y="304" font-size="9.5" fill="#3F3F46">Deflects the fare complaint.</text>
<text x="26" y="317" font-size="9.5" fill="#3F3F46">I'd ship a fare guarantee.</text>
<rect x="180.4" y="279" width="35.6" height="16" rx="8" fill="#4F46E5"/><text x="198.2" y="290.5" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Memo</text>
<text x="20" y="349" font-size="9" font-weight="400" fill="#71717A">Portfolio exercise. Opinions are mine;</text>
<text x="20" y="364" font-size="9" font-weight="400" fill="#71717A">I don't work at these companies.</text>
<text x="120" y="462" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Mock of the live page.</text>
</svg>
