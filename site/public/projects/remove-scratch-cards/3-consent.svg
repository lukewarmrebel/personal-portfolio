<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#18181B">Better picks for you?</text>
<text x="20" y="70" font-size="10" font-weight="400" fill="#71717A">One question, asked once</text>
<text x="20" y="93" font-size="11" font-weight="600" fill="#18181B">Can we use the shops you pay</text>
<text x="20" y="111" font-size="11" font-weight="600" fill="#18181B">at to pick your weekly rewards?</text>
<rect x="16" y="133" width="208" height="82" rx="8" fill="#F4F4F5"/>
<text x="26" y="151" font-size="11" font-weight="700" fill="#3F3F46">What we use</text>
<text x="26" y="166" font-size="9.5" fill="#3F3F46">Shop types and how often you go</text>
<text x="26" y="179" font-size="9.5" fill="#3F3F46">Only merchant payments</text>
<text x="26" y="192" font-size="9.5" fill="#3F3F46">Never friends and family payments</text>
<text x="26" y="205" font-size="9.5" fill="#3F3F46">Never health, religion, loans, betting</text>
<rect x="16" y="223" width="208" height="44" rx="8" fill="#F4F4F5"/>
<text x="26" y="241" font-size="9.5" fill="#3F3F46">Merchants see totals, never you.</text>
<text x="26" y="254" font-size="9.5" fill="#3F3F46">Withdraw any time; we delete it.</text>
<rect x="16" y="275" width="208" height="34" rx="17" fill="#18181B"/><text x="120" y="296" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Yes, use my payments</text>
<rect x="16" y="317" width="208" height="34" rx="17" fill="#FFFFFF" stroke="#D4D4D8"/><text x="120" y="338" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">No, show general picks</text>
<text x="120" y="462" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Consent first, one purpose.</text>
</svg>
