<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#18181B">When is a flag good enough?</text>
<text x="20" y="70" font-size="10" fill="#71717A">Calibration · sample data</text>
<text x="20" y="96" font-size="9.5" fill="#3F3F46">Flags at 90-100% confidence</text><text x="220" y="96" font-size="9.5" font-weight="700" fill="#3730A3" text-anchor="end">right 95%</text>
<rect x="20" y="101" width="200" height="8" rx="4" fill="#E4E4E7"/><rect x="20" y="101" width="190" height="8" rx="4" fill="#4F46E5"/>
<text x="20" y="128" font-size="9.5" fill="#3F3F46">Flags at 70-90%</text><text x="220" y="128" font-size="9.5" font-weight="700" fill="#3730A3" text-anchor="end">right 78%</text>
<rect x="20" y="133" width="200" height="8" rx="4" fill="#E4E4E7"/><rect x="20" y="133" width="156" height="8" rx="4" fill="#4F46E5"/>
<text x="20" y="160" font-size="9.5" fill="#3F3F46">Flags at 50-70%</text><text x="220" y="160" font-size="9.5" font-weight="700" fill="#71717A" text-anchor="end">right 55%</text>
<rect x="20" y="165" width="200" height="8" rx="4" fill="#E4E4E7"/><rect x="20" y="165" width="110" height="8" rx="4" fill="#A1A1AA"/>
<rect x="16" y="184" width="208" height="77" rx="10" fill="#EEF2FF" stroke="#EEF2FF" stroke-width="1.5"/>
<text x="28" y="204" font-size="11.5" font-weight="700" fill="#3730A3">Thresholds I would set</text>
<text x="28" y="221" font-size="10" fill="#3730A3">Act on 90%+. Review 70-90%. Below</text>
<text x="28" y="236" font-size="10" fill="#3730A3">70%, show as “unsure” and ask for a</text>
<text x="28" y="251" font-size="10" fill="#3730A3">document.</text>
<rect x="16" y="269" width="208" height="44" rx="10" fill="#F4F4F5" stroke="#F4F4F5" stroke-width="1.5"/>
<text x="28" y="289" font-size="10" fill="#3F3F46">If shown confidence and real</text>
<text x="28" y="304" font-size="10" fill="#3F3F46">accuracy drift apart, retrain.</text>
<text x="120" y="466" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Wireframe · sample data</text>
</svg>
