<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" font-family="Inter, system-ui, sans-serif">
<rect x="1" y="1" width="238" height="478" rx="28" fill="#FFFFFF" stroke="#3F3F46" stroke-width="2"/>
<rect x="90" y="12" width="60" height="6" rx="3" fill="#D4D4D8"/>
<text x="20" y="50" font-size="15" font-weight="700" fill="#3F3F46">Talk to someone</text>
<text x="20" y="70" font-size="10" fill="#71717A">When it's more than a bad day</text>
<rect x="16" y="88" width="208" height="70" rx="10" fill="#EEF2FF"/>
<text x="28" y="112" font-size="11" font-weight="700" fill="#3730A3" text-anchor="start">You've felt low for a while.</text>
<text x="28" y="130" font-size="9.5" font-weight="400" fill="#3730A3" text-anchor="start">Talking to someone can help.</text>
<text x="28" y="146" font-size="9.5" font-weight="400" fill="#3730A3" text-anchor="start">It's your choice. Nothing is shared.</text>
<rect x="16" y="176" width="208" height="58" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="28" y="201" font-size="10.5" font-weight="600" fill="#18181B" text-anchor="start">Book a college counsellor</text>
<text x="28" y="218" font-size="8.8" font-weight="400" fill="#71717A" text-anchor="start">Pick a time that suits you</text>
<text x="208" y="209" font-size="14" font-weight="600" fill="#4F46E5" text-anchor="end">›</text>
<rect x="16" y="244" width="208" height="58" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="269" font-size="10.5" font-weight="600" fill="#18181B" text-anchor="start">Chat with a trained peer</text>
<text x="28" y="286" font-size="8.8" font-weight="400" fill="#71717A" text-anchor="start">Anonymous, text only</text>
<text x="208" y="277" font-size="14" font-weight="600" fill="#4F46E5" text-anchor="end">›</text>
<rect x="16" y="312" width="208" height="58" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="337" font-size="10.5" font-weight="600" fill="#18181B" text-anchor="start">Urgent help now</text>
<text x="28" y="354" font-size="8.8" font-weight="400" fill="#71717A" text-anchor="start">Call a helpline</text>
<text x="208" y="345" font-size="14" font-weight="600" fill="#4F46E5" text-anchor="end">›</text>
<rect x="16" y="390" width="208" height="36" rx="18" fill="#4F46E5"/>
<text x="120" y="412" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book a counsellor</text>
<text x="120" y="466" font-size="8.5" fill="#A1A1AA" text-anchor="middle">Illustrative wireframe · sample data</text>
</svg>
